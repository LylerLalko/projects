<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F4;--panel:#fff;--ink:#17202B;--mute:#5E6B7A;--line:#D5DBE2;--accent:#0E7C66;--accent-bg:#DDF2EC;--hover:#F5F8FA}
@media (prefers-color-scheme:dark){:root{--bg:#10151B;--panel:#18202A;--ink:#E7ECF1;--mute:#93A0AE;--line:#2B3644;--accent:#3FCFAE;--accent-bg:#14392F;--hover:#1D2733}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:32px 16px 64px}
main{max-width:1000px;margin:0 auto}
h1{font-size:28px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
#summary{color:var(--mute);margin:0 0 20px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.controls input,.controls select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.controls input{flex:1 1 220px;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:180px}
td.notes,th.notes{text-align:left;white-space:normal;color:var(--mute);min-width:160px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:13px;color:var(--mute);padding:0}
th button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:10px 12px;text-align:inherit}
th button:hover{color:var(--ink)}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
th[aria-sort] button{color:var(--ink)}
th[aria-sort="ascending"] button::after{content:" ↑"}
th[aria-sort="descending"] button::after{content:" ↓"}
.box{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;border:1.5px solid var(--line)}
.box.on{background:var(--accent);border-color:var(--accent);color:#fff}
.box.on::before{content:"✓";font-size:14px;font-weight:600;line-height:1}
@media (prefers-color-scheme:dark){.box.on{color:#0B1A16}}
.prog{display:flex;align-items:center;gap:8px;justify-content:center}
.bar{width:56px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.count{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px;min-width:30px;text-align:left}
tr.done td:first-child{color:var(--accent);font-weight:500}
.msg{padding:28px 16px;text-align:center;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .2s}}
</style>
</head>
<body>
<main>
  <h1>Progress</h1>
  <p id="summary">Loading…</p>
  <div class="controls">
    <input id="q" type="search" placeholder="Search projects and notes" aria-label="Search projects and notes">
    <select id="status" aria-label="Filter by status">
      <option value="">All statuses</option>
      <option value="done">Done</option>
      <option value="progress">In progress</option>
      <option value="none">Not started</option>
    </select>
    <select id="missing" aria-label="Filter by missing step"><option value="">Any step</option></select>
  </div>
  <div class="wrap"><table id="t"></table></div>
</main>
<script>
// Everything on this page comes from projects.csv. You shouldn’t need to edit this file.
const DONE = /^(x|y|yes|true|1|✓|✔|done)$/i;
const NOTES = "notes";
let cols = [], rows = [], sort = {key: null, dir: 1};

function parseCSV(t){
  t = t.replace(/^\uFEFF/, "");
  const out = []; let r = [], f = "", q = false;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){ if (c === '"'){ if (t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ","){ r.push(f); f = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && t[i+1] === "\n") i++; r.push(f); out.push(r); r = []; f = ""; }
    else f += c;
  }
  if (f !== "" || r.length){ r.push(f); out.push(r); }
  return out.filter(x => x.some(v => v.trim()));
}

function load(text){
  const data = parseCSV(text);
  const head = data.shift().map(h => h.trim());
  const notesIdx = head.findIndex((h, i) => i > 0 && h.toLowerCase() === NOTES);
  cols = head.map((h, i) => ({name: h, i})).filter(c => c.i > 0 && c.i !== notesIdx);
  rows = data.map(r => {
    const checks = cols.map(c => DONE.test((r[c.i] || "").trim()));
    const n = checks.filter(Boolean).length;
    return {name: (r[0] || "").trim(), notes: notesIdx > 0 ? (r[notesIdx] || "").trim() : "", checks, n,
      pct: cols.length ? n / cols.length : 0,
      status: n === 0 ? "none" : n === cols.length ? "done" : "progress"};
  });
  const sel = document.getElementById("missing");
  cols.forEach((c, k) => { const o = document.createElement("option"); o.value = k; o.textContent = "Missing: " + c.name; sel.appendChild(o); });
  sel.hidden = !cols.length;
  render();
}

function visible(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const st = document.getElementById("status").value;
  const ms = document.getElementById("missing").value;
  let list = rows.filter(r =>
    (!q || (r.name + " " + r.notes).toLowerCase().includes(q)) &&
    (!st || r.status === st) &&
    (ms === "" || !r.checks[+ms]));
  if (sort.key !== null){
    const k = sort.key, d = sort.dir;
    list = list.slice().sort((a, b) => {
      let v = k === "name" ? a.name.localeCompare(b.name, undefined, {numeric: true})
            : k === "progress" ? a.pct - b.pct
            : (a.checks[k] ? 1 : 0) - (b.checks[k] ? 1 : 0);
      return v * d || a.name.localeCompare(b.name);
    });
  }
  return list;
}

function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function headerCell(label, key, cls){
  const th = el("th", cls);
  const b = el("button", null, label); b.type = "button";
  if (sort.key === key) th.setAttribute("aria-sort", sort.dir === 1 ? "ascending" : "descending");
  b.onclick = () => {
    if (sort.key === key) sort.dir = -sort.dir;
    else sort = {key, dir: key === "name" ? 1 : -1};
    render();
  };
  th.appendChild(b); return th;
}

function render(){
  const t = document.getElementById("t"); t.replaceChildren();
  const hasNotes = rows.some(r => r.notes);
  const thead = el("thead"), hr = el("tr");
  hr.appendChild(headerCell("Project", "name"));
  cols.forEach((c, k) => hr.appendChild(headerCell(c.name, k)));
  hr.appendChild(headerCell("Progress", "progress"));
  if (hasNotes) hr.appendChild(el("th", "notes", "")).firstChild;
  thead.appendChild(hr); t.appendChild(thead);
  if (hasNotes){ const th = hr.lastChild; const s = el("span", null, "Notes"); s.style.cssText = "display:block;padding:10px 12px"; th.appendChild(s); }

  const list = visible(), tb = el("tbody");
  list.forEach(r => {
    const tr = el("tr", r.status === "done" ? "done" : "");
    tr.appendChild(el("td", null, r.name));
    r.checks.forEach((on, k) => {
      const td = el("td"), b = el("span", "box" + (on ? " on" : ""));
      b.setAttribute("role", "img"); b.setAttribute("aria-label", cols[k].name + (on ? ": done" : ": not done"));
      td.appendChild(b); tr.appendChild(td);
    });
    const p = el("td"), w = el("div", "prog"), bar = el("div", "bar"), i = el("i");
    i.style.width = Math.round(r.pct * 100) + "%"; bar.appendChild(i);
    w.append(bar, el("span", "count", r.n + "/" + cols.length)); p.appendChild(w); tr.appendChild(p);
    if (hasNotes) tr.appendChild(el("td", "notes", r.notes));
    tb.appendChild(tr);
  });
  if (!list.length){
    const tr = el("tr"), td = el("td", "msg", rows.length ? "No projects match. Try clearing the search or filters." : "No projects yet. Add a row to projects.csv.");
    td.colSpan = cols.length + 3; tr.appendChild(td); tb.appendChild(tr);
  }
  t.appendChild(tb);
  const done = rows.filter(r => r.status === "done").length;
  document.getElementById("summary").textContent =
    rows.length + (rows.length === 1 ? " project" : " projects") + ", " + done + " done" +
    (list.length !== rows.length ? " (showing " + list.length + ")" : "");
}

["q", "status", "missing"].forEach(id => document.getElementById(id).addEventListener("input", render));

fetch("projects.csv?t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(load)
  .catch(() => {
    document.getElementById("summary").textContent = "Couldn’t load projects.csv. Make sure it sits next to index.html, and open the site through GitHub Pages (or a local server), not by double-clicking the file.";
  });
</script>
</body>
</html>
